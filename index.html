  <style>
    :root {
      /* -- SKY PALETTE -- */
      --sky-main: #EBF8FF; /* Πολύ απαλό γαλάζιο ουρανού */
      --sky-gradient: linear-gradient(180deg, #EBF8FF 0%, #D6EEFF 100%);
      --cloud-white: #FFFFFF;
      --text-dark: #1A202C;
      --text-muted: #4A5568;
      
      /* Gold Accents (προσαρμοσμένα για ανοιχτό φόντο) */
      --warm-gold: #C59F49; 
      --accent-gold-hover: #A67C1E;
      --border-gold: rgba(197, 159, 73, 0.6);

      /* Darker elements where needed (footer overlay) */
      --dark-overlay-bg: rgba(26, 32, 44, 0.85);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: var(--sky-main);
      color: var(--text-dark);
      font-family: 'Lora', Georgia, serif;
      font-size: 1.22rem;
      line-height: 1.8;
      overflow-x: hidden;
    }

    h1, h2, h3, h4, .brand-font {
      font-family: 'Playfair Display', Georgia, serif;
      letter-spacing: 0.5px;
      font-weight: 700;
      color: var(--text-dark);
    }

    .badge-font {
      font-family: 'Montserrat', sans-serif;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      font-weight: 700;
    }

    /* NAVIGATION (Light Version) */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 75px;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 3.5rem;
      background-color: var(--cloud-white);
      box-shadow: 0 2px 15px rgba(0,0,0,0.06);
      border-bottom: 1px solid var(--border-gold);
    }

    /* OVERHANGING LOGO (No changes needed to shape, just shadow) */
    .nav-logo-link {
      position: relative;
      top: 48px;
      display: inline-block;
      text-decoration: none;
      z-index: 1010;
      cursor: pointer;
    }

    .nav-logo-link img {
      height: 158px;
      width: auto;
      filter: drop-shadow(0 8px 15px rgba(0,0,0,0.3));
      transition: transform 0.35s ease-out;
    }

    .nav-logo-link:hover img {
      transform: translateY(8px) scale(1.02);
    }

    .nav-menu {
      display: flex;
      gap: 1.8rem;
      align-items: center;
    }

    .nav-menu a {
      color: var(--text-dark);
      text-decoration: none;
      font-size: 1.15rem;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      letter-spacing: 1.2px;
      transition: color 0.3s;
    }

    .nav-menu a:hover { color: var(--warm-gold); }

    /* RIGHT CONTROLS (Layout Changed) */
    .nav-right-controls {
      display: flex;
      align-items: center;
      gap: 1rem; /* Απόσταση μεταξύ εισιτηρίων και γλώσσας */
    }

    /* LANGUAGE BTN (Symazemeno) */
    .lang-btn {
      background: transparent;
      border: 1px solid var(--warm-gold);
      color: var(--warm-gold);
      padding: 0.3rem 0.6rem; /* Πιο μικρό */
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1.0rem;
      cursor: pointer;
      border-radius: 3px;
      transition: all 0.3s;
    }

    .lang-btn:hover {
      background: var(--warm-gold);
      color: #FFFFFF;
    }

    .hamburger-btn {
      display: none;
      background: transparent;
      border: none;
      color: var(--text-dark);
      font-size: 1.8rem;
      cursor: pointer;
    }

    /* MOBILE MENU OVERLAY (Light Version) */
    .mobile-menu-overlay {
      position: fixed;
      top: 75px;
      left: 0;
      width: 100%;
      height: calc(100vh - 75px);
      background-color: var(--cloud-white);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      gap: 2rem;
      z-index: 999;
      opacity: 0;
      visibility: hidden;
      transition: all 0.4s ease;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }

    .mobile-menu-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .mobile-menu-overlay a {
      color: var(--text-dark);
      text-decoration: none;
      font-size: 1.5rem;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      letter-spacing: 1.5px;
      transition: color 0.3s;
    }

    .mobile-menu-overlay a:hover { color: var(--warm-gold); }

    /* MOBILE LANG (Symazemeno) */
    .mobile-lang-btn {
      background: transparent;
      border: 1px solid var(--warm-gold);
      color: var(--warm-gold);
      padding: 0.6rem 2rem;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1.2rem;
      cursor: pointer;
      border-radius: 3px;
      margin-top: 1rem;
    }

    /* BUTTONS (Light Theme) */
    .btn {
      display: inline-block;
      padding: 0.8rem 2rem;
      font-family: 'Montserrat', sans-serif;
      font-weight: 700;
      font-size: 1.2rem;
      letter-spacing: 1.2px;
      text-decoration: none;
      border-radius: 3px;
      transition: all 0.3s ease;
      text-transform: uppercase;
      cursor: pointer;
    }

    .btn-gold {
      background-color: var(--warm-gold);
      color: #FFFFFF;
      border: 1px solid var(--warm-gold);
    }

    .btn-gold:hover {
      background-color: var(--accent-gold-hover);
      border-color: var(--accent-gold-hover);
      transform: translateY(-2px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    /* HERO (Image based, no changes needed, blends with sky) */
    .hero {
      position: relative;
      height: 100vh;
      min-height: 640px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      padding-top: 75px;
    }

    .video-background {
      position: absolute;
      top: 50%; left: 50%;
      width: 100vw; height: 56.25vw;
      min-height: 100vh; min-width: 177.77vh;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 1;
      opacity: 0.9; /* Απαλή */
    }

    .video-background iframe { width: 100%; height: 100%; border: 0; }

    .hero-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at center, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.6) 100%);
      z-index: 2;
    }

    .hero-content {
      position: relative;
      z-index: 3;
      max-width: 900px;
      padding: 0 1.5rem;
    }

    .hero-title {
      font-size: 3.5rem;
      color: var(--text-dark);
      margin-bottom: 1rem;
      line-height: 1.2;
      letter-spacing: 1.5px;
      font-weight: 800;
      text-shadow: 0 3px 10px rgba(255,255,255,0.8); /* Λάμψη στο φως */
    }

    .hero-date {
      font-size: 1.6rem;
      color: var(--text-dark);
      letter-spacing: 2.5px;
      font-weight: 700;
      text-shadow: 0 3px 10px rgba(255,255,255,0.8);
    }

    /* BLOCK STRUCTURE (Light) */
    .block-section {
      width: 100%;
      padding: 6.5rem 2rem;
      position: relative;
    }

    .block-inner { max-width: 1240px; margin: 0 auto; }

    .block-header { text-align: center; margin-bottom: 4rem; }

    .block-header .sub-badge {
      color: var(--warm-gold);
      font-size: 1.2rem;
      letter-spacing: 2.5px;
      display: block;
      margin-bottom: 0.4rem;
    }

    .dashed-divider {
      width: 90px;
      height: 2px;
      border-top: 2px dashed var(--warm-gold);
      margin: 1.2rem auto;
      opacity: 0.7;
    }

    /* 1. INTRO BLOCK (Sky Background + Balloon Placement) */
    .block-intro {
      background-image: var(--sky-gradient);
      border-bottom: 1px solid var(--border-gold);
      padding-top: 10rem; /* Χώρος για το overhanging logo */
    }

    .intro-grid {
      display: grid;
      grid-template-columns: 1.3fr 0.7fr;
      gap: 3.5rem;
      align-items: start; /* Στοίχιση πάνω για να πατάει ωραία το αερόστατο */
    }

    .vern-quote-box {
      background: rgba(255, 255, 255, 0.7); /* Ημιδιάφανο λευκό/σύννεφο */
      border: 1px solid var(--border-gold);
      border-left: 4px solid var(--warm-gold);
      padding: 1.8rem;
      border-radius: 6px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      margin-bottom: 3rem;
      width: 100%;
      text-align: left;
      backdrop-filter: blur(5px);
    }

    .vern-quote-native {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-size: 1.3rem;
      color: var(--text-dark);
      line-height: 1.6;
      margin-bottom: 1rem;
    }

    .vern-quote-french {
      font-family: 'Playfair Display', Georgia, serif;
      font-style: italic;
      font-size: 1.2rem;
      color: var(--text-muted);
      line-height: 1.6;
      border-top: 1px dashed rgba(197, 159, 73, 0.4);
      padding-top: 1rem;
    }
